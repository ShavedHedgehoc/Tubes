server {
    listen 80;
    server_name localhost;
    
    # Нацеливаем корень сразу на папку с файлами
    root /usr/share/nginx/files/uploads;

    autoindex on;
    autoindex_format html;
    autoindex_exact_size off;
    autoindex_localtime on;

    sendfile on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Чтобы картинки открывались корректно
    location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Content-Type image/jpeg; # Или auto
    }
}
