server {
    listen 8080;
    server_name localhost;
    
    root /usr/share/nginx/files;

    # ГЛОБАЛЬНЫЕ НАСТРОЙКИ (действуют на все папки)
    autoindex on;
    autoindex_format json;      # <--- Теперь JSON будет везде по умолчанию
    autoindex_exact_size off;
    autoindex_localtime on;

    sendfile on;
    client_max_body_size 1G;
    server_tokens off;

    # Разрешаем CORS глобально
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

    # 1. Обработка корня и папки /files/
    location / {
        try_files $uri $uri/ =404;
    }

    # 2. Явное указание для папки images (которую видно на скриншоте)
    location ^~ /images/ {
        # Если файлы лежат в /usr/share/nginx/files/images
        root /usr/share/nginx/files; 
        autoindex on;
        autoindex_format json;
    }

    # 3. Статика (чтобы картинки открывались, а не скачивались)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        # Если запрос заканчивается на / (попытка листинга), отдаем JSON
        if ($request_uri ~* "/$") {
            return 302 $request_uri; 
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
