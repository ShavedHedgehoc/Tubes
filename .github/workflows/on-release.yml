name: Release & Sync Version

on:
  push:
    branches: [release]

jobs:
  bump-and-sync:
    # Важно: запускаем только если коммит не автоматический
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_PAT }}

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump & Push to Release
        run: |
          npm version patch --include-workspace-root --workspaces -m "chore: release %s [skip ci]"
          git push origin release --follow-tags
      - name: Sync version to Main
        run: |
          # Прямой пуш из release в main, чтобы они стали идентичны
          git push origin release:main
