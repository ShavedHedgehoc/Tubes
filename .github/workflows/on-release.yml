name: Release, Sync & Build Docker

on:
  push:
    branches: [release]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  bump-sync-and-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_PAT }}

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump & Push to Release
        run: |
          npm install -g pnpm@10
          pnpm version patch --no-git-checks -m "chore: release %s [skip ci]"
          NEW_VERSION=$(node -p "require('./package.json').version")
          pnpm --filter "./apps/**" --filter "./packages/**" exec npm version $NEW_VERSION --no-git-tag-version
          git add apps/*/package.json packages/*/package.json pnpm-lock.yaml
          git commit --amend --no-edit
          git push origin release --follow-tags --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Monorepo Images
        run: |
          IMAGE_OWNER=$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO=$(echo "${{ env.REPO_NAME }}" | tr '[:upper:]' '[:lower:]')

          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          export NEXT_PUBLIC_API_URL="/api/tubes"
          export INTERNAL_API_URL="http://tubes_api:7100/api_tubes"

          # Запускаем сборку всех 6 образов
          docker compose -p monorepo -f docker-compose.build.yml build

          # Список сервисов в точности как в файле docker-compose.build.yml
          SERVICES="tubes_api public_api new_app tubes_dash nginx nginx-file-server"

          for svc in $SERVICES; do
            docker tag monorepo-${svc} ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:latest
            docker push ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:latest
          done
      - name: Sync version to Main
        run: |
          git reset --hard HEAD
          git clean -fd         
          git fetch origin main          
          git checkout main          
          git merge release --no-edit          
          git push origin main
