name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]

jobs:
  pre-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci --no-fund
      # - name: Check Formatting (Prettier)
      #   run: npx prettier --check .
      - name: Generate Prisma
        run: npx prisma@6.19.0 generate --schema=./db/prisma/schema.prisma
      - name: Lint & Type Check All
        run: |
          npm run lint:all
          npm run types:all
      - name: Knip Cleanliness Check
        run: npx knip --reporter github-actions

  # --- Сборка всех пакетов параллельно ---
  build:
    needs: pre-flight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Используем матрицу, чтобы не дублировать код джоб
        package: [api_tubes, public_api, tubes_application, new-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci --no-fund
      - name: Generate Prisma (only for API)
        if: matrix.package != 'tubes_application'
        run: npx prisma@6.19.0 generate --schema=./db/prisma/schema.prisma
      - name: Build ${{ matrix.package }}
        run: npm run build -w ${{ matrix.package }}
